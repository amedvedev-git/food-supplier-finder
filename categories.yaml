# Дерево категорий. nets — каким сетям нужна категория (sushkof — «Сушкоф и пицца», zhiznmart — «Жизньмарт»).
# kw — регулярки (без учёта регистра) для отнесения объявления/сайта к категории.
# queries — запросы в Яндекс (город добавляется сам). productcenter — рубрики каталога производителей.
# minus — минус-слова: поставщик с ними в объявлении категории в её выдачу не попадает.

- id: salmon
  name: Лосось и форель
  nets: [sushkof, zhiznmart]
  kw: ['лосос', 'с[её]мг', 'форел', 'кижуч', 'нерк', 'горбуш', 'salmon']
  queries: ['лосось охлажденный оптом поставщик', 'форель семга оптом для ресторанов']
  productcenter: [catalog-ryba-morieprodukty-317]

- id: seafood
  name: Креветки, угорь, тунец
  nets: [sushkof]
  kw: ['кревет', 'угор', 'унаги', 'тун[еца]', 'кальмар', 'краб', 'мидии', 'осьминог', 'морепродукт']
  queries: ['креветки угорь тунец оптом поставщик', 'морепродукты оптом для суши']
  productcenter: [catalog-ryba-morieprodukty-317]

- id: roe
  name: Икра тобико и масаго
  nets: [sushkof]
  kw: ['тобико', 'масаго', 'икра летучей', 'икра мойвы', 'икра капелина']
  queries: ['икра тобико масаго оптом поставщик']
  productcenter: [catalog-ryba-morieprodukty-317]

- id: nori
  name: Нори и водоросли
  nets: [sushkof]
  kw: ['(?<![а-яё])нори(?![а-яё])', 'водоросл', '(?<![а-яё])чука', 'вакаме']
  queries: ['нори для суши оптом поставщик', 'продукты для суши оптом нори васаби']
  productcenter: []

- id: rice
  name: Рис
  nets: [sushkof, zhiznmart]
  kw: ['(?<![а-яё])рис(?:а|у|ом|ов(?:ый|ая|ой|ую|ые|ых))?(?![а-яё])']
  queries: ['рис для суши оптом поставщик', 'рис оптом для общепита']
  productcenter: [catalog-krupy-601]

- id: flour
  name: Мука
  nets: [sushkof, zhiznmart]
  kw: ['(?<![а-яё])мук[аиуе](?![а-яё])', 'тип 00']
  queries: ['мука для пиццы оптом поставщик', 'мука оптом для пекарен и общепита']
  productcenter: [catalog-bakalieia-208]

- id: cheese
  name: Сыры (моцарелла, сливочный)
  nets: [sushkof, zhiznmart]
  kw: ['(?<![а-яё])сыр(?:а|ы|ов|ом|ный|ная|ные)?(?![а-яё])', 'моцарел', 'сливочн', 'филадельф', 'пармезан', 'чеддер']
  queries: ['сыр моцарелла оптом для пиццерий', 'сливочный сыр для роллов оптом']
  productcenter: [catalog-molochnyie-produkty-316]

- id: dairy
  name: Молочная продукция и яйцо
  nets: [zhiznmart]
  kw: ['молок', 'молочн', 'сметан', 'творог', 'кефир', 'сливки', 'яйц']
  queries: ['молочная продукция оптом для общепита поставщик', 'яйцо куриное оптом поставщик']
  productcenter: [catalog-molochnyie-produkty-316, catalog-iaitso-516]

- id: meat
  name: Мясо и птица
  nets: [sushkof, zhiznmart]
  kw: ['мяс(?![^,]{0,25}(?:краб|миди|кревет|кальмар|рыб))', 'говядин', 'свинин', 'курин', 'куриц', 'бройлер', 'индейк', 'ветчин', 'пепперони', 'бекон', 'колбас']
  queries: ['мясо птица оптом для общепита поставщик', 'пепперони ветчина для пиццы оптом']
  productcenter: [catalog-miaso-203]

- id: vegetables
  name: Овощи и зелень
  nets: [sushkof, zhiznmart]
  kw: ['овощ', 'огурц', 'огур[еч]', 'томат', 'помидор', 'авокадо', 'зелен', 'салат', 'картоф', 'капуст', 'перец', '(?<![а-яё])лук(?![а-яё])']
  queries: ['овощи и зелень оптом для ресторанов поставщик']
  productcenter: [catalog-ovoshchi-773]

- id: sauces
  name: Соусы и специи
  nets: [sushkof, zhiznmart]
  kw: ['соус', 'со[ея]в', 'васаби', 'имбир', 'кетчуп', 'майонез', 'специ[иейя](?![а-яё])', 'приправ', 'уксус', 'кунжут', 'терияки', 'унаги']
  queries: ['соусы для общепита оптом поставщик', 'соевый соус васаби имбирь оптом']
  productcenter: [catalog-sousy-610]

- id: oil
  name: Масло растительное и фритюрное
  nets: [sushkof, zhiznmart]
  kw: ['масл[оа] (подсолнечн|растительн|рапсов|оливков|фритюр)', 'фритюр', 'подсолнечн\w* масл']
  queries: ['масло фритюрное оптом для общепита поставщик']
  productcenter: []

- id: packaging
  name: Упаковка для доставки
  nets: [sushkof, zhiznmart]
  kw: ['упаков', 'контейнер', 'коробк', 'ланч-?бокс', 'крафт', 'пакет', 'одноразов', 'палочк']
  # минус-слова: упаковка не для доставки еды (проверка топ-10, 29.10.2026)
  minus: ['бутыл\w*\s+для\s+воды', 'кулер', 'теплоизоляц', 'утеплит', 'вспененн', 'стекл\w*\s*тар', 'тар\w*\s+из\s+стекла',
          'стройматериал', 'мусорн', 'крышк\w*\s+для\s+консерв', 'колбасн\w*\s+оболоч|оболочек\s+для\s+колбас',
          'пузырчат']
  queries: ['упаковка для доставки еды оптом поставщик', 'коробки для пиццы и контейнеры для роллов оптом']
  productcenter: [catalog-upakovka-155, catalog-upakovochnyie-matierialy-583]

- id: drinks
  name: Напитки
  nets: [sushkof, zhiznmart]
  kw: ['напит', '(?<![а-яё])сок(?:и|а|ов)?(?![а-яё])', 'вод[аы] (питьев|минерал)', 'лимонад', '(?<![а-яё])морс(?:а|ы|ов)?(?![а-яё])', 'газиров']
  queries: ['напитки оптом для общепита поставщик']
  productcenter: [catalog-napitki-201]

- id: desserts
  name: Кондитерские изделия и выпечка
  nets: [zhiznmart]
  kw: ['кондитер', 'торт', 'пирожн', 'десерт', 'выпечк', 'чизкейк', 'печень[еяи]', 'булоч']
  queries: ['десерты и выпечка оптом для кафе поставщик']
  productcenter: [catalog-konditierskiie-izdieliia-427]

- id: groats
  name: Крупы и бакалея
  nets: [zhiznmart]
  kw: ['(?<![а-яё])круп[аы]?(?![а-яё])', 'гречк', 'гречнев', 'макарон', 'бакале', 'булгур', 'кускус', 'чечевиц']
  queries: ['крупы и бакалея оптом для общепита поставщик']
  productcenter: [catalog-krupy-601, catalog-bakalieia-208]
